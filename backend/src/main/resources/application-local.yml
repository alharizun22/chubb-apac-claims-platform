server:
  port: 8080

spring:
  application:
    name: chubb-claims-service-local
  context:
    initializer:
      classes: com.chubb.claims.common.kafka.EmbeddedKafkaContextInitializer

  datasource:
    url: jdbc:h2:mem:chubb_claims;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true
    show-sql: false
    open-in-view: false

  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: false

  kafka:
    bootstrap-servers: ${spring.embedded.kafka.brokers}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: true
    consumer:
      group-id: chubb-claims-local-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.chubb.claims.*"

chubb:
  kafka:
    topics:
      claim-events: chubb.claims.events

logging:
  level:
    com.chubb.claims: DEBUG
    org.apache.kafka: INFO
    org.springframework.kafka: INFO
