server:
  port: 0

spring:
  application:
    name: chubb-claims-service-test
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration

  datasource:
    url: jdbc:h2:mem:chubb_claims_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
    show-sql: false
    open-in-view: false

  kafka:
    listener:
      auto-startup: false
    admin:
      auto-create: false

chubb:
  kafka:
    topics:
      claim-events: chubb.claims.events.test

logging:
  level:
    com.chubb.claims: DEBUG
    org.apache.kafka: ERROR
    org.springframework.kafka: ERROR
